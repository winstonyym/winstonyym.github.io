<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">WY 3D black and white favicon</title>
  <desc id="desc">A geometric black and white WY monogram inspired by modular bar letterforms, with subtle 3D extrusion.</desc>
  <rect width="512" height="512" fill="#ffffff"/>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 3D extrusion offset used consistently for all blocks -->
  <g filter="url(#softShadow)" stroke-linejoin="miter" stroke-linecap="square">

    <!-- W: left tall bar -->
    <g>
      <polygon points="58,124 86,96 86,388 58,360" fill="#262626"/>
      <polygon points="58,124 104,124 132,96 86,96" fill="#3a3a3a"/>
      <polygon points="104,124 132,96 132,388 104,416" fill="#1f1f1f"/>
      <rect x="58" y="124" width="46" height="292" fill="#050505"/>
    </g>

    <!-- W: inner lower bar -->
    <g>
      <polygon points="132,244 160,216 160,388 132,360" fill="#262626"/>
      <polygon points="132,244 178,244 206,216 160,216" fill="#3a3a3a"/>
      <polygon points="178,244 206,216 206,388 178,416" fill="#1f1f1f"/>
      <rect x="132" y="244" width="46" height="172" fill="#050505"/>
    </g>

    <!-- W: central tall bar -->
    <g>
      <polygon points="206,124 234,96 234,388 206,360" fill="#262626"/>
      <polygon points="206,124 252,124 280,96 234,96" fill="#3a3a3a"/>
      <polygon points="252,124 280,96 280,388 252,416" fill="#1f1f1f"/>
      <rect x="206" y="124" width="46" height="292" fill="#050505"/>
    </g>

    <!-- Y: left upper diagonal arm -->
    <g transform="rotate(-18 330 178)">
      <polygon points="310,116 338,88 338,236 310,208" fill="#262626"/>
      <polygon points="310,116 356,116 384,88 338,88" fill="#3a3a3a"/>
      <polygon points="356,116 384,88 384,236 356,264" fill="#1f1f1f"/>
      <rect x="310" y="116" width="46" height="148" fill="#050505"/>
    </g>

    <!-- Y: right upper diagonal arm -->
    <g transform="rotate(18 426 178)">
      <polygon points="402,116 430,88 430,236 402,208" fill="#262626"/>
      <polygon points="402,116 448,116 476,88 430,88" fill="#3a3a3a"/>
      <polygon points="448,116 476,88 476,236 448,264" fill="#1f1f1f"/>
      <rect x="402" y="116" width="46" height="148" fill="#050505"/>
    </g>

    <!-- Y: vertical stem -->
    <g>
      <polygon points="365,252 393,224 393,388 365,360" fill="#262626"/>
      <polygon points="365,252 411,252 439,224 393,224" fill="#3a3a3a"/>
      <polygon points="411,252 439,224 439,388 411,416" fill="#1f1f1f"/>
      <rect x="365" y="252" width="46" height="164" fill="#050505"/>
    </g>
  </g>
</svg>
